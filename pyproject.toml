[project]
name = "ilgeojwo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "divin3circle", email = "sylus.abel@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "easyocr>=1.7.2",
    "einops>=0.8.2",
    "fastapi>=0.142.2",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "qrcode[pil]>=8.2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.0.0",
    "uvicorn>=0.54.0",
]


[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
